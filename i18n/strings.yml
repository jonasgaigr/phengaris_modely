  en: "Modelled habitat with p < {p_min} (ha)"
col_n_straddle:
  cs: "Polygony přesahující hranici EVL"
  en: "Polygons crossing the SCI boundary"
col_cut_off:
  cs: "Plocha vně EVL (ha)"
  en: "Area outside SCI (ha)"
col_flag:
  cs: "Upozornění"
  en: "Flag"
flag_zero:
  cs: "bez preferovaného biotopu"
  en: "no preferred habitat"
col_kves:
  cs: "Kategorie KVES"
  en: "KVES category"
col_pclass:
