# --- Map -----------------------------------------------------------------------
map_intro:
  cs: "Hranice EVL jsou zobrazeny obrysem v barvě druhu, pro který je lokalita vymezena, preferovaný biotop plochou. Vrstvy a podkladovou mapu lze přepínat v pravém horním rohu mapy. Kliknutím na lokalitu nebo plochu biotopu se zobrazí podrobnosti. V lokalitách, kde jsou předmětem ochrany oba druhy, se biotopy obou druhů překrývají; jednotlivé vrstvy lze vypnout. Body s bílým okrajem jsou nálezy druhu z Nálezové databáze ochrany přírody (NDOP) od roku {year} uvnitř EVL, v nichž je druh předmětem ochrany."
  en: "SCI boundaries are drawn as outlines in the colour of the species they are designated for, preferred habitat as filled areas. Layers and the basemap can be switched in the top-right corner of the map. Click a site or a habitat patch for details. In sites where both species are qualifying features, the habitats of the two species overlap; switch layers off to see each one. Dots with a white border are records of the species from the Species Occurrence Database of the Nature Conservation Agency (NDOP) since {year}, inside the SCIs where the species is a qualifying feature."
zoom_label:
  cs: "Přiblížit na lokalitu:"
  en: "Zoom to site:"
zoom_all:
  cs: "– všechny lokality –"
  en: "– all sites –"
base_osm:
  cs: "OpenStreetMap"
  en: "OpenStreetMap"
base_aerial:
  cs: "Letecké snímky (Esri)"
  en: "Aerial imagery (Esri)"
