# --- Site-level view -----------------------------------------------------------
site_intro:
  cs: "Tabulka rozděluje preferovaný biotop každé lokality podle kategorie KVES a třídy modelové pravděpodobnosti výskytu. Výběrem lokality v seznamu nad mapou nebo kliknutím na řádek souhrnné tabulky se mapa přiblíží na lokalitu a tato tabulka se omezí na její řádky."
  en: "The table breaks down the preferred habitat of each site by KVES category and by class of modelled probability of occurrence. Selecting a site in the list above the map, or clicking a row of the summary table, zooms the map to the site and limits this table to its rows."

