# --- Summary table ---------------------------------------------------------------
table_intro:
  cs: "Jeden řádek odpovídá jedné kombinaci lokality a druhu. Tabulku lze řadit kliknutím na záhlaví sloupce a prohledávat. Kliknutím na řádek se mapa přiblíží na danou lokalitu. Sloupec „Plocha vně EVL“ udává, jaká část polygonů preferovaného biotopu, které přesahují hranici lokality, leží mimo ni a do výsledku se nezapočítává."
  en: "Each row is one site–species combination. Click a column header to sort, or use the search box. Click a row to zoom the map to that site. The column “Area outside SCI” gives the part of preferred-habitat polygons crossing the site boundary that lies outside the site and is not counted."
col_site_code:
  cs: "Kód lokality"
  en: "Site code"
col_site_name:
  cs: "Název lokality"
  en: "Site name"
col_species:
  cs: "Druh"
  en: "Species"
col_site_area:
  cs: "Rozloha EVL (ha)"
  en: "SCI area (ha)"
col_hab_area:
  cs: "Preferovaný biotop (ha)"
  en: "Preferred habitat (ha)"
col_cover:
  cs: "Podíl z rozlohy EVL (%)"
  en: "Share of SCI area (%)"
col_below:
